<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>一覧・図鑑作成（CardMaker） - たけこのこ</title>
<meta name="description" content="画像・テキストを組み合わせてカード画像やPDFを作成できるツール。一覧表や図鑑づくりに使えます。">
<link rel="canonical" href="https://takekonoko.com/apps/cardmaker/">
<meta property="og:type" content="website">
<meta property="og:title" content="一覧・図鑑作成（CardMaker）">
<meta property="og:description" content="画像・テキストを組み合わせてカード画像やPDFを作成。">
<meta property="og:url" content="https://takekonoko.com/apps/cardmaker/">
<meta property="og:image" content="https://takekonoko.com/images/cardmaker.png">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
:root{
  --a4-w:297mm; --a4-h:210mm;
  --pad:8mm; --gap:5mm;
  --dark-bg:#1a1a1a; --panel-bg:#242424;
  --text:#eaeaea; --muted:#a5a5a5;
  --accent:#ffb84d; --card-bg:#fff; --label-bg:rgba(10,10,10,.7);
}
*{box-sizing:border-box;font-family:"Noto Sans JP",sans-serif}
body{margin:0;background:var(--dark-bg);color:var(--text);display:flex;flex-direction:column;height:100vh}

/* Header */
header{
  padding:10px 14px;background:var(--panel-bg);border-bottom:1px solid #333;
  display:flex;align-items:center;gap:12px;position:relative
}
header h1{font-size:16px;margin:0}
header .spacer{flex:1}
.pagebar{display:flex;align-items:center;gap:8px;margin-right:8px;position:relative;z-index:1}
.pagebar .label{color:var(--muted);font-size:13px}
.pagebar .btns{display:flex;gap:6px}
.pagebar button{
  min-width:44px;height:32px;padding:0 10px;border:1px solid #555;border-radius:8px;
  background:#2b2b2b;color:#ddd;cursor:pointer;transition:.15s;position:relative;z-index:2
}
.pagebar button:hover{background:#343434}
.pagebar button.active{background:var(--accent);color:#000;border-color:transparent}
.pagebar .now{color:var(--accent);font-size:13px;font-weight:700;margin-left:8px;white-space:nowrap;background:#2b2b2b;border:1px solid var(--accent);border-radius:6px;padding:2px 8px;}

/* Download dropdown */
.dropdown{position:relative;margin-left:12px}
.dropbtn{
  display:flex;align-items:center;gap:6px;
  height:34px;padding:0 12px;border:1px solid #555;border-radius:8px;
  background:#2b2b2b;color:#ddd;cursor:pointer;transition:.15s
}
.dropbtn:hover{background:#343434}
.menu{
  position:absolute;right:0;top:42px;min-width:220px;
  background:#2a2a2a;border:1px solid #444;border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.45);
  padding:6px;display:none;z-index:10
}
.menu.open{display:block}
.menu .group{padding:6px 6px 2px;color:#bbb;font-size:12px}
.menu button{
  width:100%;text-align:left;margin:4px 0;padding:8px 10px;border:1px solid transparent;border-radius:8px;
  background:#333;color:#eee;cursor:pointer
}
.menu button:hover{background:#3b3b3b}
.menu .icon{width:18px;display:inline-block;text-align:center;margin-right:6px}

/* Layout panes */
main{flex:1;display:flex;overflow:hidden}
aside{flex:3;max-width:520px;overflow:auto;padding:14px;background:var(--panel-bg);border-right:1px solid #333}
section{flex:7;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:20px 12px}

/* Preview board */
#board{position:relative;width:var(--a4-w);height:var(--a4-h);background:#111;border:1px solid #444;border-radius:8px;background-size:cover;background-position:center;box-shadow:0 0 15px rgba(0,0,0,.8);overflow:hidden}
#fadeLayer{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#grid{position:relative;z-index:2;display:grid;gap:var(--gap);padding:var(--pad);height:100%;align-content:start}
#logo{position:absolute;z-index:3;opacity:0;width:20%;left:80%;top:80%;pointer-events:none;transition:opacity .3s}

/* Card */
.card{position:relative;display:flex;align-items:center;justify-content:center;background:var(--card-bg);border:1px solid #555;border-radius:10px;overflow:hidden;box-shadow:0 0 8px rgba(0,0,0,.6);text-align:center;cursor:pointer}
.imgbox{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--card-bg)}
.imgbox img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;margin:auto;}
.label{position:absolute;bottom:0;width:100%;background:var(--label-bg);padding:6px;border-top:1px solid rgba(255,255,255,.1);color:#eee}
.name{font-weight:700;font-size:13px;line-height:1.2}
.desc{font-size:11px;color:#ccc;white-space:pre-wrap;margin-top:2px;line-height:1.2}

/* Form */
input,textarea,button,select{width:100%;font-size:14px;padding:8px;border:1px solid #555;border-radius:8px;background:#1a1a1a;color:var(--text)}
input[type="range"]{accent-color:var(--accent)}
textarea{resize:vertical;height:200px;line-height:1.45}
button.primary{background:var(--accent);color:#000;border:none}
hr{border:none;border-bottom:1px solid #333;margin:12px 0}
h3{margin:12px 0 6px;color:#ffd}
select{background:#1a1a1a}

/* Toggle */
.switch{position:relative;display:inline-block;width:48px;height:26px;vertical-align:middle}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;inset:0;background:#555;border-radius:26px;transition:.2s}
.slider:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .slider{background:var(--accent)}
.switch input:checked + .slider:before{transform:translateX(22px)}
.hidden{display:none!important}
.note{font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<header>
  <h1>CardMaker（カードメーカー）</h1>
  <div class="spacer"></div>

  <div class="pagebar">
    <div class="label">ページ</div>
    <div class="btns">
      <button id="toP1" class="active">1</button>
      <button id="toP2">2</button>
    </div>
    <div id="nowText" class="now">現在: 1</div>
  </div>

  <div class="dropdown" id="dlBox">
    <button class="dropbtn" id="dlBtn">📥 ダウンロード ▼</button>
    <div class="menu" id="dlMenu" aria-hidden="true">
      <div class="group">PDF</div>
      <button id="pdfP1"><span class="icon">🎞️</span>PDF（1ページ目）</button>
      <button id="pdfP2"><span class="icon">🎞️</span>PDF（2ページ目）</button>
      <button id="pdfBoth"><span class="icon">📄</span>PDF（両方）</button>
      <div class="group">画像（現在ページ）</div>
      <button id="imgPng"><span class="icon">🖼️</span>PNG で保存</button>
      <button id="imgJpg"><span class="icon">🖼️</span>JPEG で保存</button>
    </div>
  </div>
</header>

<main>
  <aside>
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:8px">
      <button id="saveTheme" class="primary">テーマ保存</button>
      <button id="loadThemeBtn">読み込み</button>
    </div>
    <input id="loadThemeInput" type="file" accept="application/json" class="hidden">

    <hr>
    <label>レイアウト:
      <select id="orientation">
        <option value="landscape" selected>横</option>
        <option value="portrait">縦</option>
      </select>
    </label>
    <label>余白の広さ:
      <select id="marginLevel">
        <option value="1">せまい</option>
        <option value="2">ややせまい</option>
        <option value="3" selected>ふつう</option>
        <option value="4">ややひろい</option>
        <option value="5">ひろい</option>
      </select>
    </label>

    <!-- 追加: カード背景の明るさバー（白↔黒） -->
    <label>カード背景の明るさ:
      <input id="cardShade" type="range" min="0" max="100" value="100">
    </label>

    <label>背景画像:<input id="bg" type="file" accept="image/*"></label>
    <label>背景の薄さ:<input id="fadeRange" type="range" min="0" max="100" value="0"></label>

    <hr>
    <label>ロゴを表示:
      <label class="switch"><input id="logoToggle" type="checkbox"><span class="slider"></span></label>
    </label>
    <label>ロゴ画像:<input id="logoInput" type="file" accept="image/*"></label>
    <div id="logoControls" class="hidden">
      <label>ロゴの大きさ:<input id="logoSize" type="range" min="5" max="50" value="20"></label>
      <label>ロゴ横位置:<input id="logoX" type="range" min="0" max="100" value="80"></label>
      <label>ロゴ縦位置:<input id="logoY" type="range" min="0" max="100" value="80"></label>
    </div>

    <hr>
    <label>項目数:<input id="itemCount" type="number" min="1" max="50" value="20"></label>
    <h3>名称リスト（行ごと）</h3>
    <textarea id="nameList" placeholder="例：セミ&#10;カマキリ&#10;チョウ"></textarea>
    <h3>説明リスト（任意）</h3>
    <textarea id="descList" placeholder="例：夏に鳴く昆虫&#10;鎌のある捕食者&#10;美しい羽を持つ"></textarea>
    <button id="generate" class="primary">一覧を再生成</button>
    <div class="note">名称・説明・件数は入力と同時に反映。</div>
  </aside>

  <section>
    <div id="board">
      <div id="fadeLayer"></div>
      <div id="grid"></div>
      <img id="logo" alt="">
    </div>
  </section>
</main>

<script>
/* refs */
const board=document.getElementById('board'), fadeLayer=document.getElementById('fadeLayer'), grid=document.getElementById('grid');
const bg=document.getElementById('bg'), fadeRange=document.getElementById('fadeRange');
const orient=document.getElementById('orientation'), marginSel=document.getElementById('marginLevel');
const nameList=document.getElementById('nameList'), descList=document.getElementById('descList'), itemCount=document.getElementById('itemCount'), generateBtn=document.getElementById('generate');
const logo=document.getElementById('logo'), logoToggle=document.getElementById('logoToggle'), logoInput=document.getElementById('logoInput');
const logoControls=document.getElementById('logoControls'), logoSize=document.getElementById('logoSize'), logoX=document.getElementById('logoX'), logoY=document.getElementById('logoY');
const saveThemeBtn=document.getElementById('saveTheme'), loadThemeBtn=document.getElementById('loadThemeBtn'), loadThemeInput=document.getElementById('loadThemeInput');
const toP1=document.getElementById('toP1'), toP2=document.getElementById('toP2'), nowText=document.getElementById('nowText');
const dlBtn=document.getElementById('dlBtn'), dlMenu=document.getElementById('dlMenu');
const pdfP1=document.getElementById('pdfP1'), pdfP2=document.getElementById('pdfP2'), pdfBoth=document.getElementById('pdfBoth');
const imgPng=document.getElementById('imgPng'), imgJpg=document.getElementById('imgJpg');
const cardShade=document.getElementById('cardShade');

/* state */
function blankPage(){
  return{
    orientation:'landscape',
    marginLevel:'3',
    cardShade:100,
    background:{url:'',fade:0},
    logo:{enabled:false,url:'',size:20,x:80,y:80},
    namesText:'',descsText:'',
    count:20,
    items:[]
  };
}
let pages=[blankPage(),blankPage()], current=0;

/* util */
function escapeHTML(s){return (s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function applyMargin(level){
  const lv=+level;
  const pad=[4,6,8,10,12][lv-1]||8;
  const gap=[3,5,6,8,10][lv-1]||6;
  document.documentElement.style.setProperty('--pad',pad+'mm');
  document.documentElement.style.setProperty('--gap',gap+'mm');
}
function chooseCols(n,land){
  if(n<=1)return 1;
  let best={c:Math.ceil(Math.sqrt(n)),s:999};
  const tar=land?297/210:210/297;
  for(let c=2;c<=6;c++){
    const r=Math.ceil(n/c);
    const s=Math.abs((c/r)-tar)+((c*r-n)*.02);
    if(s<best.s)best={c,s};
  }
  return best.c;
}
async function capture(scale=2.5){return await html2canvas(board,{scale,backgroundColor:"#111"});}

/* data build */
function rebuildItems(p){
  const names=(p.namesText||'').trim().split(/\r?\n/);
  const descs=(p.descsText||'').trim().split(/\r?\n/);
  const count=Math.max(p.count||names.length||1,names.length,descs.length);
  const old=p.items||[];
  p.items=Array.from({length:count},(_,i)=>({
    name:(names[i]??'').trim()||`項目${i+1}`,
    desc:(descs[i]??'').trim(),
    url:old[i]?.url||''
  }));
}

/* render */
function autoLayout(){
  const p=pages[current];
  grid.innerHTML='';
  if(!p.items.length)return;
  const land=p.orientation==='landscape';
  const c=chooseCols(p.items.length,land);
  const r=Math.ceil(p.items.length/c);
  grid.style.gridTemplateColumns=`repeat(${c},1fr)`;
  grid.style.gridTemplateRows=`repeat(${r},1fr)`;
  p.items.forEach((it,i)=>{
    const card=document.createElement('div');card.className='card';
    const img=it.url?`<img src="${it.url}" alt="">`:'<div style="color:#888;font-size:12px;">画像をクリックで選択</div>';
    const txt=it.desc
      ?`<div class="label"><div class="name">${escapeHTML(it.name)}</div><div class="desc">${escapeHTML(it.desc)}</div></div>`
      :`<div class="label"><div class="name">${escapeHTML(it.name)}</div></div>`;
    card.innerHTML=`<div class="imgbox">${img}</div>${txt}`;
    card.addEventListener('click',()=>{
      const fi=document.createElement('input');
      fi.type='file';fi.accept='image/*';
      fi.onchange=e=>{
        const f=e.target.files?.[0];if(!f)return;
        const r=new FileReader();
        r.onload=()=>{p.items[i].url=r.result;autoLayout();};
        r.readAsDataURL(f);
      };
      fi.click();
    });
    grid.appendChild(card);
  });
}

/* page<->ui */
function loadPage(idx){
  const p=pages[idx];
  // orientation
  orient.value=p.orientation;
  const land=p.orientation==='landscape';
  document.documentElement.style.setProperty('--a4-w',land?'297mm':'210mm');
  document.documentElement.style.setProperty('--a4-h',land?'210mm':'297mm');

  // margin
  marginSel.value=p.marginLevel; applyMargin(p.marginLevel);

  // card shade
  cardShade.value=p.cardShade;
  const col=`hsl(0,0%,${p.cardShade}%)`;
  document.documentElement.style.setProperty('--card-bg',col);
  document.documentElement.style.setProperty('--label-bg',p.cardShade>60?'rgba(10,10,10,0.7)':'rgba(255,255,255,0.15)');

  // background
  board.style.backgroundImage=p.background.url?`url(${p.background.url})`:'';
  fadeRange.value=p.background.fade; fadeLayer.style.opacity=(p.background.fade||0)/100;

  // logo
  logoToggle.checked=p.logo.enabled;
  logoControls.classList.toggle('hidden',!p.logo.enabled);
  logo.style.opacity=p.logo.enabled?1:0;
  logo.src=p.logo.url||'';
  logoSize.value=p.logo.size; logo.style.width=p.logo.size+'%';
  logoX.value=p.logo.x; logo.style.left=p.logo.x+'%';
  logoY.value=p.logo.y; logo.style.top=p.logo.y+'%';

  // lists
  nameList.value=p.namesText; descList.value=p.descsText; itemCount.value=p.count;
  if(!p.items.length) rebuildItems(p);

  autoLayout();
  toP1.classList.toggle('active',idx===0);
  toP2.classList.toggle('active',idx===1);
  nowText.textContent=`現在: ${idx+1}`;
}
function savePage(idx){
  const p=pages[idx];
  p.orientation=orient.value;
  p.marginLevel=marginSel.value;
  p.cardShade=+cardShade.value;
  p.background.fade=+fadeRange.value;
  p.logo.enabled=logoToggle.checked;
  p.logo.size=+logoSize.value; p.logo.x=+logoX.value; p.logo.y=+logoY.value;
  p.logo.url=logo.src||'';
  p.namesText=nameList.value; p.descsText=descList.value;
  p.count=+itemCount.value||p.items.length||20;
}

/* live inputs */
nameList.addEventListener('input',()=>{pages[current].namesText=nameList.value;rebuildItems(pages[current]);autoLayout();});
descList.addEventListener('input',()=>{pages[current].descsText=descList.value;rebuildItems(pages[current]);autoLayout();});
itemCount.addEventListener('input',()=>{pages[current].count=+itemCount.value||1;rebuildItems(pages[current]);autoLayout();});
generateBtn.addEventListener('click',()=>{rebuildItems(pages[current]);autoLayout();});

/* design controls */
cardShade.addEventListener('input',()=>{
  const val=+cardShade.value;
  const color=`hsl(0,0%,${val}%)`;
  document.documentElement.style.setProperty('--card-bg',color);
  document.documentElement.style.setProperty('--label-bg',val>60?'rgba(10,10,10,0.7)':'rgba(255,255,255,0.15)');
  pages[current].cardShade=val; autoLayout();
});
fadeRange.addEventListener('input',()=>{pages[current].background.fade=+fadeRange.value;fadeLayer.style.opacity=+fadeRange.value/100;});
bg.addEventListener('change',e=>{
  const f=e.target.files?.[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{pages[current].background.url=r.result;board.style.backgroundImage=`url(${r.result})`;};
  r.readAsDataURL(f);
});
orient.addEventListener('change',()=>{
  pages[current].orientation=orient.value;
  const land=orient.value==='landscape';
  document.documentElement.style.setProperty('--a4-w',land?'297mm':'210mm');
  document.documentElement.style.setProperty('--a4-h',land?'210mm':'297mm');
  autoLayout();
});
marginSel.addEventListener('change',()=>{pages[current].marginLevel=marginSel.value;applyMargin(marginSel.value);autoLayout();});

/* logo */
logoToggle.addEventListener('change',()=>{pages[current].logo.enabled=logoToggle.checked;logo.style.opacity=logoToggle.checked?1:0;logoControls.classList.toggle('hidden',!logoToggle.checked);});
logoInput.addEventListener('change',e=>{
  const f=e.target.files?.[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{pages[current].logo.url=r.result;logo.src=r.result;if(logoToggle.checked)logo.style.opacity=1;};
  r.readAsDataURL(f);
});
logoSize.addEventListener('input',()=>{pages[current].logo.size=+logoSize.value;logo.style.width=logoSize.value+'%';});
logoX.addEventListener('input',()=>{pages[current].logo.x=+logoX.value;logo.style.left=logoX.value+'%';});
logoY.addEventListener('input',()=>{pages[current].logo.y=+logoY.value;logo.style.top=logoY.value+'%';});

/* page switch */
function switchTo(idx){savePage(current);current=idx;loadPage(idx);}
toP1.addEventListener('click',()=>switchTo(0));
toP2.addEventListener('click',()=>switchTo(1));

/* download menu logic */
function toggleMenu(open){
  dlMenu.classList.toggle('open',open);
  dlMenu.setAttribute('aria-hidden', open? 'false':'true');
}
dlBtn.addEventListener('click',(e)=>{e.stopPropagation();toggleMenu(!dlMenu.classList.contains('open'));});
document.addEventListener('click',()=>{toggleMenu(false);});
dlMenu.addEventListener('click',e=>e.stopPropagation());

async function renderPage(idx){const prev=current;switchTo(idx);const c=await capture(2.5);switchTo(prev);return c;}
async function exportPdfTargets(targets){
  const {jsPDF}=window.jspdf;
  const first=pages[targets[0]];
  const pdf=new jsPDF({orientation:first.orientation==='landscape'?'l':'p',unit:'mm',format:'a4'});
  for(let i=0;i<targets.length;i++){
    const idx=targets[i];
    const canvas=await renderPage(idx);
    const img=canvas.toDataURL('image/jpeg',0.95);
    const land=pages[idx].orientation==='landscape';
    if(i>0) pdf.addPage('a4',land?'l':'p');
    pdf.addImage(img,'JPEG',0,0,land?297:210,land?210:297);
  }
  pdf.save(targets.length===1 ? (targets[0]===0?'list_p1.pdf':'list_p2.pdf') : 'list_both.pdf');
}
async function exportImage(fmt){
  const canvas=await renderPage(current);
  const mime=fmt==='jpeg'?'image/jpeg':'image/png';
  const url=fmt==='jpeg'?canvas.toDataURL(mime,0.95):canvas.toDataURL(mime);
  const a=document.createElement('a');a.href=url;a.download=fmt==='jpeg'?`page${current+1}.jpg`:`page${current+1}.png`;a.click();
}

/* menu actions */
pdfP1.addEventListener('click',async ()=>{toggleMenu(false);await exportPdfTargets([0]);});
pdfP2.addEventListener('click',async ()=>{toggleMenu(false);await exportPdfTargets([1]);});
pdfBoth.addEventListener('click',async ()=>{toggleMenu(false);await exportPdfTargets([0,1]);});
imgPng.addEventListener('click',async ()=>{toggleMenu(false);await exportImage('png');});
imgJpg.addEventListener('click',async ()=>{toggleMenu(false);await exportImage('jpeg');});

/* theme save/load */
saveThemeBtn.addEventListener('click',()=>{
  savePage(current);
  const data={version:"26",pages};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='theme_v26.json';a.click();
  URL.revokeObjectURL(a.href);
});
loadThemeBtn.addEventListener('click',()=>loadThemeInput.click());
loadThemeInput.addEventListener('change',e=>{
  const f=e.target.files?.[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!Array.isArray(d.pages)||d.pages.length<2) throw new Error('pages不足');
      pages=[d.pages[0],d.pages[1]];
      loadPage(0); // 直接読み込み。savePageを介さない
    }catch{
      alert('読み込み失敗。JSONを確認してください。');
    }
  };
  r.readAsText(f);
});

/* init */
applyMargin('3'); loadPage(0);
</script>

<div style="text-align:center;padding:12px 16px;font-size:13px;color:#666;border-top:1px solid #333;">
  by <a href="https://takekonoko.com/" style="color:#ffb84d;text-decoration:none;font-weight:600;">takekonoko.com</a>
</div>
</body>
</html>
